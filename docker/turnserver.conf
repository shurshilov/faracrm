# FARA CRM — конфигурация встроенного TURN/STUN (coturn)
#
# Меняется редко, поэтому лежит файлом. То, что зависит от установки (realm,
# внешний IP, сертификаты), передаётся аргументами из docker-compose.yml, а
# секрет приходит файлом из общего тома — его создаёт бэкенд при первом старте.
#
# Релей входит в поставку и стартует вместе с остальными сервисами. Из
# обязательного руками — только открыть порты на хосте (3478/udp, 3478/tcp,
# 49160-49259/udp): host-сеть правила ufw не обходит.
#
# Настройки, которые видит браузер (адрес, порты, ttl кредов, режим relay),
# живут не здесь, а в CRM: «Системные настройки», ключи turn.*. Они меняются
# на лету. Здесь — только то, что относится к самому серверу релея, и после
# правки этого файла нужен `docker compose restart turn`.
#
# Проверить, что релей действительно работает: в CRM «Настройки» → «Релей
# звонков (TURN)», кнопка «Проверить релей». Она делает настоящую аллокацию
# теми же кредами, что получает браузер, и заодно показывает, что видит сам
# браузер: адрес relay-кандидата и поднимается ли через релей соединение.

# ── Слушаем ──────────────────────────────────────────────────────
listening-port=3478
# TCP-плечо на том же порту нужно там, где наружу закрыт UDP — а это типовая
# корпоративная сеть, ради которой релей и ставится.
# tls-listening-port=5349   # включать вместе с cert/pkey ниже

# Диапазон релей-портов. Считать надо не по звонкам, а по АЛЛОКАЦИЯМ: браузер
# берёт отдельную аллокацию на КАЖДЫЙ turn-URL (udp, tcp и tls — это три
# разных), поэтому один участник разговора может занять до трёх портов.
# 100 портов ≈ 33 участника с релеем одновременно. Через релей идут только те
# звонки, где не собралось прямое соединение, так что для CRM это с запасом.
min-port=49160
max-port=49259

# ── Авторизация ──────────────────────────────────────────────────
# Временные креды (TURN REST API): username = "<срок>:<user_id>", пароль —
# HMAC от секрета. Список пользователей серверу не нужен, синхронизировать
# сотрудников не требуется. Секрет передаётся аргументом из общего файла
# (см. docker-compose.yml) — здесь его нет намеренно.
use-auth-secret
fingerprint

# ── Безопасность ─────────────────────────────────────────────────
# ГЛАВНОЕ правило: релей не должен уметь ходить во внутреннюю сеть. Иначе
# любой, кто получил креды, дотянется через нас до postgres и до соседей
# по докер-сети. Разрешаем только публичные адреса.
no-multicast-peers

# Релей ЧУЖОГО TCP (RFC 6062) не нужен никому: WebRTC передаёт медиа по UDP, а
# TURN-over-TCP — это транспорт ДО релея, он остаётся. Без этой строки любой
# сотрудник с выданными кредами превращает сервер CRM в открытый TCP-прокси.
no-tcp-relay

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Те же приватные сети, записанные как IPv4-mapped IPv6 (::ffff:10.0.0.1).
# Если сервер слушает IPv6, такой адрес — обходной путь к тем же машинам.
denied-peer-ip=::ffff:0.0.0.0-::ffff:0.255.255.255
denied-peer-ip=::ffff:10.0.0.0-::ffff:10.255.255.255
denied-peer-ip=::ffff:100.64.0.0-::ffff:100.127.255.255
denied-peer-ip=::ffff:127.0.0.0-::ffff:127.255.255.255
denied-peer-ip=::ffff:169.254.0.0-::ffff:169.254.255.255
denied-peer-ip=::ffff:172.16.0.0-::ffff:172.31.255.255
denied-peer-ip=::ffff:192.168.0.0-::ffff:192.168.255.255
# ИСКЛЮЧЕНИЕ: если АТС стоит в той же приватной сети, её адрес нужно вернуть
# обратно — иначе браузер не сможет говорить с ней через релей. Строка
# добавляется в TURN_EXTRA_ARGS: --allowed-peer-ip=192.168.1.10

# Потолки — это ЧИСЛО ОДНОВРЕМЕННЫХ АЛЛОКАЦИЙ (не мегабиты).
# 12 на пользователя = до четырёх параллельных соединений у одного сотрудника,
# общий потолок держим В ГРАНИЦАХ диапазона портов: больше аллокаций, чем
# портов, релей всё равно не выдаст — незачем обещать.
user-quota=12
total-quota=100

# CLI-интерфейс coturn наружу не нужен.
no-cli

# ── TLS (turns:) ─────────────────────────────────────────────────
# Вместе с TLS имеет смысл отключить устаревшие версии протокола (строки
# ниже держим закомментированными, пока TLS выключен: неизвестную директиву
# coturn не примет, а список этих опций между версиями менялся):
#   no-tlsv1
#   no-tlsv1_1
#
# Сертификат берём тот же, что у сайта (certbot из deploy/proxy). Включение:
#   1) раскомментировать tls-listening-port выше;
#   2) в CRM: «Системные настройки» → turn.tls_port = 5349;
#   3) раскомментировать монтирование сертификатов в docker-compose.yml;
#   4) добавить в .env:
#        TURN_EXTRA_ARGS=--cert=/etc/coturn/certs/fullchain.pem --pkey=/etc/coturn/certs/privkey.pem
# ВАЖНО про права: certbot кладёт privkey.pem с правами 0600 root, а релей
# работает не от root и прочитать его не сможет. Нужен deploy-hook, который
# после выпуска и после КАЖДОГО продления копирует пару в отдельную папку и
# делает её читаемой релею, например:
#   cp /etc/letsencrypt/live/ДОМЕН/{fullchain,privkey}.pem /opt/faracrm/turn-certs/
#   chmod 0644 /opt/faracrm/turn-certs/*.pem
#   docker compose restart turn      # сертификат перечитывается только при старте
# и монтирование этой папки в /etc/coturn/certs.

# ── Логи ─────────────────────────────────────────────────────────
# В stdout, чтобы читались через `docker compose logs turn`. Учтите: в них
# видно, кто и с какого IP звонил — это персональные данные, и ротацию
# докер-логов стоит настроить отдельно (см. deploy/README).
log-file=stdout
simple-log
